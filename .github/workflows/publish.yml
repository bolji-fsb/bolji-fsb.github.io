# Every 15 minutes: re-read fsb.unizg.hr and publish https://bolji-fsb.github.io/
# (the website + data.json + the downloadable offline file bolji-fsb.html).
name: publish
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # keep downloaded FSB pages between runs so we only re-download what's stale
      - uses: actions/cache@v4
        with:
          path: cache
          key: fsb-cache-${{ github.run_id }}
          restore-keys: fsb-cache-
      - run: python3 export.py --site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Every 15 minutes: re-read fsb.unizg.hr, rebuild the offline HTML file + data.json,
# and force-push them as a single commit to the "data" branch.
# The HTML file fetches data.json from there (raw.githubusercontent.com) when it's online.
name: publish
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # keep downloaded FSB pages between runs so we only re-download what's stale
      - uses: actions/cache@v4
        with:
          path: cache
          key: fsb-cache-${{ github.run_id }}
          restore-keys: fsb-cache-
      - run: python3 export.py --site
      - name: Push to the data branch (one commit, no growing history)
        run: |
          cd dist/site
          rm -f index.html
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json fsb-online.html
          git commit -q -m "Data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
